  <text x="728" y="621" fill="#17324D" opacity=".33" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="3.2" text-anchor="end">JBM / AHMEDABAD</text>
  <path d="M72 607h150" stroke="#17324D" stroke-opacity=".18"/>
  <text x="72" y="631" fill="#17324D" opacity=".57" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.4">MADE FOR THE BOARDROOM</text>
  <text x="726" y="130" fill="#17324D" opacity=".1" font-family="Arial, sans-serif" font-size="66" font-weight="700" text-anchor="end">02</text>
