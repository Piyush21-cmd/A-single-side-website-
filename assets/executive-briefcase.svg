<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="bagTitle bagDesc">
  <title id="bagTitle">Executive laptop briefcase in charcoal with copper zipper details</title>
  <desc id="bagDesc">Studio product illustration of a structured corporate laptop briefcase by Jyoti Bag Manufacturing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEECE6"/>
      <stop offset=".6" stop-color="#E7E5DE"/>
      <stop offset="1" stop-color="#D9D7CF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#42535B"/>
      <stop offset=".4" stop-color="#303F47"/>
      <stop offset="1" stop-color="#1D2B32"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#3D4E56"/>
      <stop offset=".56" stop-color="#2B3A42"/>
      <stop offset="1" stop-color="#223037"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#374850"/>
      <stop offset="1" stop-color="#1D2C33"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DEA676"/>
      <stop offset=".54" stop-color="#C47B43"/>
      <stop offset="1" stop-color="#8D4C22"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C18B5D"/>
      <stop offset="1" stop-color="#8F532D"/>
    </linearGradient>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0H6M0 3H6" stroke="#F5F9FA" stroke-opacity=".045" stroke-width="1"/>
      <path d="M0 0V6M3 0V6" stroke="#031018" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#081820" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#07151C" flood-opacity=".24"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <rect width="800" height="680" fill="url(#bg)"/>
