<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="bagTitle bagDesc">
  <title id="bagTitle">Campus messenger bag in forest green with copper buckles</title>
  <desc id="bagDesc">Studio product illustration of a crossbody campus messenger bag by Jyoti Bag Manufacturing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0EDE5"/>
      <stop offset=".58" stop-color="#E8E4DA"/>
      <stop offset="1" stop-color="#DAD3C5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#50695D"/>
      <stop offset=".45" stop-color="#3D5449"/>
      <stop offset="1" stop-color="#263B32"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#4B6558"/>
      <stop offset=".55" stop-color="#3A5045"/>
      <stop offset="1" stop-color="#2A4036"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#405B4D"/>
      <stop offset="1" stop-color="#243A30"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#1B3028"/>
      <stop offset=".5" stop-color="#3B5045"/>
      <stop offset="1" stop-color="#1A2E25"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFA474"/>
      <stop offset=".52" stop-color="#C47B43"/>
      <stop offset="1" stop-color="#8E5027"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE5D4"/>
      <stop offset="1" stop-color="#D9CBB6"/>
    </linearGradient>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0H6M0 3H6" stroke="#EEF6F1" stroke-opacity=".05" stroke-width="1"/>
      <path d="M0 0V6M3 0V6" stroke="#00110A" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="21" flood-color="#081912" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#071710" flood-opacity=".24"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="800" height="680" fill="url(#bg)"/>
